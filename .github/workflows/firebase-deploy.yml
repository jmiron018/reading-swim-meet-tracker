name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_READING_SWIM_MEET_TRACKER }}
          channelId: live
          projectId: reading-swim-meet-tracker

      - name: Verify live site is up
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://reading-swim-meet-tracker.web.app/)
          echo "Live site HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Live site returned $STATUS — deploy may have failed."
            exit 1
          fi
